name: build-check

on:
  pull_request:
    branches: [main]
  push:
    branches: [feat/content-manager-v1]

jobs:
  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install --ignore-scripts
      - run: npm run build:ts
