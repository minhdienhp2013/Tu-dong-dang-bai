name: build-check

on:
  push:
    branches: [fix/remove-native-sqlite-build]
  pull_request:
    branches: [main]

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Show runtime versions
        run: |
          node -v
          npm -v
      - name: Install dependencies
        run: npm install
      - name: Verify built-in SQLite on Node 24
        run: node -e "const {DatabaseSync}=require('node:sqlite'); const db=new DatabaseSync(':memory:'); db.exec('create table t(x integer); insert into t values (24)'); console.log(db.prepare('select x from t').get()); db.close();"
      - name: Verify built-in SQLite inside Electron
        shell: pwsh
        run: |
          $env:ELECTRON_RUN_AS_NODE="1"
          npx electron -e "const {DatabaseSync}=require('node:sqlite'); const db=new DatabaseSync(':memory:'); db.exec('create table t(x integer); insert into t values (38)'); console.log(process.versions.node, db.prepare('select x from t').get()); db.close();"
      - name: Compile and renderer syntax test
        run: npm test
      - name: Build Windows installer
        run: npm run build
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: auto-social-minh-dien-windows-node24
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
