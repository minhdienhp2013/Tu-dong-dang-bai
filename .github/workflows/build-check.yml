name: build-check

on:
  push:
    branches: [feat/facebook-stability-v0.2]
  pull_request:
    branches: [main]

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Compile and renderer syntax test
        run: npm test
      - name: Build Windows installer
        run: npm run build
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: auto-social-minh-dien-windows
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
