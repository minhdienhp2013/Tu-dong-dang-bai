name: build-check

on:
  push:
    branches: [fix/node24-runtime]
  pull_request:
    branches: [main]

jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Show runtime versions
        run: |
          node -v
          npm -v
      - name: Install dependencies
        run: npm install
      - name: Verify better-sqlite3 loads on Node 24
        run: node -e "const Database=require('better-sqlite3'); const db=new Database(':memory:'); console.log(db.prepare('select 24 as node_major').get()); db.close();"
      - name: Compile and renderer syntax test
        run: npm test
      - name: Build Windows installer
        run: npm run build
      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: auto-social-minh-dien-windows-node24
          path: |
            release/*.exe
            release/*.blockmap
          if-no-files-found: error
